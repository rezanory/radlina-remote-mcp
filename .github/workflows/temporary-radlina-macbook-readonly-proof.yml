name: Temporary Read-Only MacBook Runner Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-macbook-runner:
    runs-on: [self-hosted, macOS, X64, radlina-macbook]
    timeout-minutes: 5
    steps:
      - name: Verify exact runner and read-only host identity
        shell: bash
        env:
          EXPECTED_RUNNER_NAME: radlina-macbook-main
          ACTUAL_RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          test "$ACTUAL_RUNNER_NAME" = "$EXPECTED_RUNNER_NAME"
          printf 'runner.name=%s\n' "$ACTUAL_RUNNER_NAME"
          printf 'hostname=%s\n' "$(hostname)"
          printf 'architecture=%s\n' "$(uname -m)"
          sw_vers
          node --version
