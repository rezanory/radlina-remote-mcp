name: V3 O01 Smart Operator Validation

on:
  push:
    branches:
      - generation/v3-o01-smart-operator-adapter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24.20.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize O01 formatting
        shell: pwsh
        run: |
          npx prettier --write src/v3/operator/adapter.ts tests/unit/v3/operator-adapter.test.ts scripts/acceptance/v3-o01-operator-adapter.ts
          if (-not (git diff --quiet)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/v3/operator/adapter.ts tests/unit/v3/operator-adapter.test.ts scripts/acceptance/v3-o01-operator-adapter.ts
            git commit -m "style(v3): format O01 operator adapter"
            git push
          }

      - name: Typecheck
        run: npm run typecheck

      - name: O01 unit tests
        run: npx vitest run tests/unit/v3/operator-adapter.test.ts

      - name: Lint O01 scope
        run: npx eslint src/v3/operator/adapter.ts tests/unit/v3/operator-adapter.test.ts

      - name: Format check
        run: npx prettier --check src/v3/operator/adapter.ts tests/unit/v3/operator-adapter.test.ts scripts/acceptance/v3-o01-operator-adapter.ts

      - name: Runtime acceptance
        run: npx tsx scripts/acceptance/v3-o01-operator-adapter.ts
