name: V3 Mac Physical Owner-Signed Policy Stage (no activation)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radlina-v3-mac-policy-physical-stage
  cancel-in-progress: false

jobs:
  stage:
    if: >-
      github.repository == 'rezanory/radlina-remote-mcp' &&
      github.actor == 'rezanory' &&
      github.ref == 'refs/heads/production/controller-full-control-v1'
    runs-on: [self-hosted, macOS, X64, radlina-macbook]
    environment: v3-mac-dev-validation-no-review
    timeout-minutes: 8
    steps:
      - name: Independently verify actual protected Windows owner signature and stage private Mac file
        shell: bash
        env:
          V3_SIGNED_POLICY: ${{ secrets.RADLINA_V3_MAC_OPERATOR_OWNER_SIGNED_POLICY }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RUNNER_NAME" == 'radlina-macbook-main' ]]
          [[ "$(uname -s)" == 'Darwin' && "$(uname -m)" == 'x86_64' ]]
          [[ "$(hostname)" == 'amirs-MacBook-Pro.local' ]]
          [[ "$(id -un)" == 'amirsheikhzadeh' ]]
          [[ "$(node --version)" == 'v24.20.0' ]]
          node --input-type=module <<'VERIFY_AND_STAGE'
          import {createHash,createPublicKey,verify} from 'node:crypto';
          import {readFileSync,writeFileSync,existsSync,mkdirSync,lstatSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {homedir} from 'node:os';
          import {join} from 'node:path';
          import {pathToFileURL} from 'node:url';
          const trustedManifest='dc5f17f68a43e05bccf8e94915f509e0bdfe92b381b63d58efacbeea0062cd3d';
          const ownerPin='6259d21211f73fc9d2d7cc0174d9bfdc36424cd456878671ab5683468ca0fe93';
          const macPin='f2c2e93ff120fbc5122cbb6b5a0b461a072f54bd8d226368c858fd0bd17037ea';
          const policyJson=process.env.V3_SIGNED_POLICY;
          if(!policyJson||Buffer.byteLength(policyJson,'utf8')>8192)throw Error('owner policy environment secret missing/oversized');
          const root=join(homedir(),'.local','share','radlina','v3-beta','macbook-main-agent');
          const release=join(root,'releases',trustedManifest);
          const manifest=join(release,'RELEASE_MANIFEST.json');
          if(!existsSync(manifest)||lstatSync(manifest).isSymbolicLink())throw Error('trusted immutable native Mac release missing');
          if(createHash('sha256').update(readFileSync(manifest)).digest('hex')!==trustedManifest)throw Error('native release manifest mismatch');
          // Trust only this reviewed inline verifier until the full pinned release
          // has been checked. Do NOT execute the release's own verifier first.
          const m=JSON.parse(readFileSync(manifest,'utf8'));
          if(m.schema!=='radlina.release-manifest.v2'||!Array.isArray(m.files)||m.files.length!==16610)
            throw Error('invalid pinned native release manifest schema/file count');
          const {readdirSync}=await import('node:fs');
          const actual=[];
          function visit(folder,relative='') {
            for(const ent of readdirSync(folder,{withFileTypes:true})) {
              if(ent.isSymbolicLink())throw Error('release symbolic link rejected');
              const name=relative?relative+'/'+ent.name:ent.name;
              if(!ent.name||['.','..'].includes(ent.name))throw Error('release unsafe basename');
              if(ent.isDirectory())visit(join(folder,ent.name),name);
              else if(ent.isFile())actual.push(name);
              else throw Error('release non-file entry rejected');
            }
          }
          visit(release);
          actual.sort();
          const wanted=['RELEASE_MANIFEST.json',...m.files.map(x=>x.path)].sort();
          if(actual.length!==wanted.length||actual.some((x,i)=>x!==wanted[i]))
            throw Error('native release contains missing/extra files');
          let previous='';
          for(const e of m.files) {
            const parts=typeof e.path==='string'?e.path.split('/'):[];
            if(!parts.length||parts.some(x=>!x||x==='.'||x==='..'||x.includes('\\')||x.includes(':'))||
              !Number.isSafeInteger(e.bytes)||e.bytes<0||!/^[0-9a-f]{64}$/.test(e.sha256)||
              (previous&&previous>=e.path))throw Error('invalid native manifest file');
            previous=e.path;
            const file=readFileSync(join(release,...parts));
            if(file.length!==e.bytes||createHash('sha256').update(file).digest('hex')!==e.sha256)
              throw Error('native release file digest mismatch');
          }
          console.log('v3.macOwnerPolicy.all16610ReleaseFilesVerified=true');
          const util=await import(pathToFileURL(join(release,'dist','src','utils','json.js')).href);
          if(typeof util.canonicalJson!=='function')throw Error('canonical signer serializer unavailable');
          const record=JSON.parse(policyJson);
          const p=record.policy;
          if(p?.schema!=='radlina.v3.i01.macos-physical-operator-policy/v1'||
            p.macDeviceId!=='macbook-main'||p.controllerDeviceId!=='windows-main'||
            p.macPublicKeyFingerprint!==macPin||
            p.approvalMode!=='interactive-target-local'||
            !Array.isArray(p.allowedCapabilities)||
            p.allowedCapabilities.join(',')!=='device.health,filesystem.read,filesystem.write'||
            !Number.isFinite(Date.parse(p.expiresAt))||Date.parse(p.expiresAt)<Date.now()+60*60*1000||
            !Number.isFinite(Date.parse(p.createdAt))||Date.parse(p.createdAt)>Date.now()+120000)
            throw Error('real owner policy expired, overbroad or wrong target');
          const ownerKey=createPublicKey(p.ownerPublicKeyPem);
          const pin=createHash('sha256').update(ownerKey.export({type:'spki',format:'der'})).digest('hex');
          if(ownerKey.asymmetricKeyType!=='ed25519'||pin!==ownerPin)
            throw Error('owner Ed25519 public key pin mismatch');
          const signature=Buffer.from(record.ownerSignatureBase64??'','base64');
          if(signature.length!==64||signature.toString('base64')!==record.ownerSignatureBase64||
            !verify(null,Buffer.from(util.canonicalJson(p)),ownerKey,signature))
            throw Error('physical owner signature invalid');
          const cli='/Applications/Tailscale.app/Contents/MacOS/Tailscale';
          const status=JSON.parse(execFileSync(cli,['status','--json'],{encoding:'utf8',timeout:12000,maxBuffer:1024*1024}));
          const peer=Object.values(status.Peer||{}).filter(x=>
            x.OS==='windows'&&x.Online===true&&x.DNSName?.replace(/\.$/,'').toLowerCase()==='laptop-13qineif.taile17c9e.ts.net');
          if(status.BackendState!=='Running'||status.Self?.Online!==true||
            status.CurrentTailnet?.Name!=='rezanory.github'||peer.length!==1||!peer[0]?.ID||
            createHash('sha256').update(peer[0].ID).digest('hex')!==p.windowsTailnetNodeHash)
            throw Error('trusted physical Windows P03 peer missing in live Mac Tailnet');
          const dir=join(root,'owner-policies');
          mkdirSync(dir,{recursive:true,mode:0o700});
          const folder=lstatSync(dir);
          if(folder.isSymbolicLink()||!folder.isDirectory()||(folder.mode&0o077)!==0)
            throw Error('owner policy private directory permission invalid');
          const dest=join(dir,'mac-operator-owner-signed-20261015.json');
          const bytes=Buffer.from(JSON.stringify(record)+'\n');
          const digest=createHash('sha256').update(bytes).digest('hex');
          if(existsSync(dest)) {
            const st=lstatSync(dest);
            if(st.isSymbolicLink()||!st.isFile()||(st.mode&0o077)!==0||
              createHash('sha256').update(readFileSync(dest)).digest('hex')!==digest)
              throw Error('existing physical owner policy must not be replaced');
            console.log('v3.macOwnerPolicy.alreadyStagedAndVerified=true');
          }else {
            writeFileSync(dest,bytes,{flag:'wx',mode:0o600});
            if((lstatSync(dest).mode&0o077)!==0)throw Error('owner policy file permission invalid');
            console.log('v3.macOwnerPolicy.staged=true');
          }
          console.log('v3.macOwnerPolicy.signatureVerified=true');
          console.log('v3.macOwnerPolicy.realWindowsPeerVerified=true');
          console.log('v3.macOwnerPolicy.fileSha256='+digest);
          console.log('v3.macOwnerPolicy.operatorActivated=false');
          console.log('V3_MAC_SIGNED_OWNER_POLICY_PHYSICALLY_STAGED_NOT_I01_ACCEPTANCE');
          VERIFY_AND_STAGE
