name: V3 W08 Validation

on:
  push:
    branches:
      - generation/v3-w08-workflow-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24.20.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Affected unit tests
        run: npx vitest run tests/unit/v3/workflow-runtime.test.ts tests/unit/v3/workflow-persistence.test.ts tests/unit/v3/workflow-recovery.test.ts tests/unit/v3/workflow-scheduler.test.ts

      - name: Lint affected scope
        run: npx eslint src/v3/workflow/runtime.ts src/v3/workflow/persistence.ts tests/unit/v3/workflow-runtime.test.ts

      - name: Format check
        run: npx prettier --check src/v3/workflow/runtime.ts src/v3/workflow/persistence.ts tests/unit/v3/workflow-runtime.test.ts scripts/acceptance/v3-w08-runtime.ts

      - name: Runtime acceptance
        run: npx tsx scripts/acceptance/v3-w08-runtime.ts
