name: V3 Guarded Process Acceptance
on:
  pull_request:
    paths:
      - "src/policy/repeat-guard.ts"
      - "src/tools/process/manager.ts"
      - "src/mcp.ts"
      - "src/config/schema.ts"
      - "tests/unit/process-repeat-guard.test.ts"
      - ".github/workflows/v3-repeat-guard.yml"
  push:
    branches:
      - "feature/v3-no-repeat-process-guard-20261019"
permissions:
  contents: read
concurrency:
  group: v3-no-repeat-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows-guard-validation:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Typecheck original V3 sources and guard
        run: npm run typecheck
      - name: Focused original-repository SQLite guard tests
        run: npx vitest run tests/unit/process-repeat-guard.test.ts
